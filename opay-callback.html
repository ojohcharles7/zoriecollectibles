<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing payment…</title>
<style>
  body{ background:#F7F3EA; color:#26261F; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .box{ text-align:center; padding:2rem; }
  .spinner{ width:34px; height:34px; border:3px solid #E4DCC7; border-top-color:#B8912F; border-radius:50%;
            margin:0 auto 1rem; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  p{ margin:0; font-size:.95rem; color:#6b6552; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Confirming your OPay payment…</p>
  </div>
  <script>
    // Relay: OPay returns here after payment. Hand the reference to the SPA.
    var params = new URLSearchParams(window.location.search);
    var ref = params.get('ref') || params.get('reference');
    if (ref) {
      window.location.replace('./index.html#opay-callback?ref=' + encodeURIComponent(ref));
    } else {
      window.location.replace('./index.html#checkout');
    }
  </script>
</body>
</html>
